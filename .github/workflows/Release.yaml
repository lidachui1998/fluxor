name: Build and Release fluxor

# 手动触发时可输入版本号与更新日志；两者留空则各自回退为 git describe 与 commit 消息。
# 版本号经 -ldflags 注入 buildinfo.Version（不再由前端 package.json 提供）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0）。留空则使用 git describe --tags --always'
        required: false
        default: ''
      notes:
        description: '更新日志。留空则自动从上一个 tag 到 HEAD 的 commit 消息生成；多行用 \n 分隔'
        required: false
        default: ''

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 设置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: 确定版本号
        id: version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(git describe --tags --always)
          fi
          echo "VERSION=$V" >> $GITHUB_OUTPUT
          echo "构建版本号: $V"

      - name: 清理旧构建产物
        run: rm -rf frontend/dist backend/dist dist-pkg fluxor-${{ matrix.arch }} fluxor-${{ matrix.arch }}.tar.gz

      - name: 构建前端 (frontend → frontend/dist)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: 同步前端构建产物到 backend/dist
        run: |
          rm -rf backend/dist
          cp -r frontend/dist backend/dist

      - name: 构建 Go 后端（${{ matrix.arch }}，注入版本号）
        working-directory: ./backend
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w -X fluxor/internal/buildinfo.Version=${{ steps.version.outputs.VERSION }}" \
            -o ../fluxor-${{ matrix.arch }}

      # 压缩包内二进制统一命名为 fluxor：Fluxor 自更新按该名字优先提取。
      - name: 打包 tar.gz（${{ matrix.arch }}）
        run: |
          mkdir -p dist-pkg
          cp fluxor-${{ matrix.arch }} dist-pkg/fluxor
          tar -czf fluxor-${{ matrix.arch }}.tar.gz -C dist-pkg fluxor
          tar -tzf fluxor-${{ matrix.arch }}.tar.gz
          ls -lh fluxor-${{ matrix.arch }} fluxor-${{ matrix.arch }}.tar.gz

      # 裸二进制与 tar.gz 同时上传：新版本优先取压缩包，老版本仍按原名取裸二进制，兼容不破。
      - name: 上传 fluxor-${{ matrix.arch }} 与压缩包作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fluxor-${{ matrix.arch }}
          path: |
            fluxor-${{ matrix.arch }}
            fluxor-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出源码（用于读取版本号与 commit 日志）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: get_version
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(git describe --tags --always)
          fi
          echo "VERSION=$V" >> $GITHUB_OUTPUT
          echo "发布版本号: $V"

      - name: 生成 Release Notes（优先手动输入，留空则从 commit 消息自动生成）
        id: get_notes
        env:
          # 经 env 传入而非直接内插到脚本，避免输入内容被当作 shell 代码执行
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES_INPUT" ]; then
            # 手动输入：把字面量 \n 还原为真实换行（workflow_dispatch 输入框是单行的）
            # 只替换 \n，不用 printf '%b'：后者会一并解释 \t、\c 等序列，\c 还会截断输出
            NOTES=$(printf '%s' "$NOTES_INPUT" | sed 's/\\n/\n/g')
          else
            # 留空：沿用原逻辑，取上一个 tag 到 HEAD 的完整 commit 消息
            if git describe --tags --abbrev=0 >/dev/null 2>&1; then
              LAST_TAG=$(git describe --tags --abbrev=0)
              NOTES=$(git log ${LAST_TAG}..HEAD --pretty=format:"%B")
            else
              NOTES=$(git log --pretty=format:"%B")
            fi
          fi
          # 用不易与正文冲突的分隔符，避免日志中恰好出现 EOF 时截断输出
          echo "NOTES<<RELEASE_NOTES_EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "RELEASE_NOTES_EOF" >> $GITHUB_OUTPUT

      - name: 下载所有构建产物
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: ${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.get_notes.outputs.NOTES }}
          files: artifacts/**/fluxor-*
          draft: false
          prerelease: false
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
